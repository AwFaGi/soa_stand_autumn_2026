openapi: 3.0.3
info:
  title: Orders
  version: "1.0"
  description: |
    Сервис оформления заказов — его пишете вы. В задании 1 раннер сценариев
    обращается только к `/healthz` и `/orders`; `/webhooks/delivery` и
    `/users/{id}/bonus` нужны только для задания 2 (необязательного).

    Сервис слушает порт из переменной `PORT` (по умолчанию `8080`). Адреса
    Payment, Inventory, шины событий и базы — в переменных окружения
    `DATABASE_URL`, `PAYMENT_URL`, `INVENTORY_URL`, `EVENTS_URL`.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Готовность
      description: "`200`, когда сервис готов принимать заказы."
      responses:
        "200":
          description: Готов
  /orders:
    post:
      summary: Оформить заказ
      description: |
        Отвечает `201` с одним из трёх статусов — в том числе когда Payment или
        Inventory недоступны. `400` — только на некорректное тело. Ответы `5xx`
        раннер считает ошибкой.

        Сумма заказа — `Σ qty × price_cents` по позициям.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
            example:
              user_id: u-17
              items:
                - { sku: sku-1, qty: 2, price_cents: 49900 }
      responses:
        "201":
          description: Заказ принят; статус — какой известен на момент ответа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreated"
              example: { id: "3f0c6d1e-8a52-4c1b-9d7e-2b6f3a1c9e40", status: paid }
        "400":
          description: Некорректное тело запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}:
    get:
      summary: Текущее состояние заказа
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Заказ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Заказа нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /webhooks/delivery:
    post:
      summary: Подтверждение доставки (задание 2)
      description: |
        Сюда шина доставляет событие `delivery.confirmed` (контракт Events).
        Шина доставляет его раз в секунду, пока не получит `2xx`; одно
        событие может прийти несколько раз, в том числе одновременно.
        На уже обработанное событие тоже отвечайте `2xx`.

        Бонусы по каждому событию начисляются покупателю `user_id` ровно
        один раз. События о доставке приходят от службы доставки и не
        ссылаются на ваши заказы: начисляйте бонусы по `user_id` из события,
        не ища заказ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./events.yaml#/components/schemas/DeliveryConfirmed"
      responses:
        "200":
          description: Событие обработано (или уже было обработано раньше)
        "204":
          description: То же, без тела
  /users/{id}/bonus:
    get:
      summary: Бонусный баланс покупателя (задание 2)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Баланс; у покупателя без начислений — `0`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bonus"
              example: { points: 120 }
components:
  schemas:
    Bonus:
      type: object
      required: [points]
      properties:
        points:
          type: integer
          format: int64
          minimum: 0
    OrderRequest:
      type: object
      required: [user_id, items]
      properties:
        user_id:
          type: string
          minLength: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Item"
    Item:
      type: object
      required: [sku, qty, price_cents]
      properties:
        sku:
          type: string
          minLength: 1
        qty:
          type: integer
          minimum: 1
        price_cents:
          type: integer
          format: int64
          minimum: 0
    Status:
      type: string
      enum: [paid, rejected, pending]
      description: |
        - `paid` — товар зарезервирован, деньги списаны;
        - `rejected` — заказ не состоялся: денег не взяли, резерва нет;
        - `pending` — исход ещё неизвестен, сервис продолжает разбираться.
    OrderCreated:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          description: Идентификатор заказа; его же сервис передаёт в Payment и Inventory как `order_id`
        status:
          $ref: "#/components/schemas/Status"
    Order:
      type: object
      required: [id, status, amount_cents]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        amount_cents:
          type: integer
          format: int64
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
