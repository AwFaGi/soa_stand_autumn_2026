name: soa-grade
# Имя репозитория курса (ippaveln/soa_stand_autumn_2026) — в .etc/config.json;
# выражения `if:` и `repository:` не читают файлы, поэтому здесь оно повторено
# ниже (self-test и grade `if:`, checkout `repository:`). Переименовали репозиторий — поменяйте и тут.
on:
  push:
    branches: [master]
  pull_request_target:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
# Новый push в PR отменяет прогон предыдущего коммита этого PR; push в master — по ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true
env:
  # Адрес аналитики — только здесь (в .etc/config.json его нет).
  ANALYTICS_URL: https://api.ippaveln.xyz/analytics_industry_backend_go
jobs:
  self-test:
    # Только изменения преподавателя: заглушки, раннер и грейдер собираются и
    # проходят тесты, наивный пример проходит S1. Для PR из форков пропускается:
    # код студента вне проверки не запускается.
    if: ${{ github.repository == 'ippaveln/soa_stand_autumn_2026' && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd mocks runner examples/go)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet and test course tooling
        run: |
          go vet ./cmd/...
          go test -race ./cmd/...
          (cd mocks && go vet ./... && go test -race ./...)
          (cd runner && go vet ./... && go test -race ./...)
          (cd examples/go && go vet ./...)
      - name: Naive Go example (orders/) passes S1
        run: make scenarios ONLY=S1 WAIT=3
      - name: Naive Python example passes S1
        run: make scenarios ONLY=S1 WAIT=3 ORDERS_DIR=./examples/python
      - name: Naive Go example passes S1 of task 2
        run: make scenarios TASK=2 ONLY=S1 WAIT=3 ORDERS_DIR=./examples/go
      - name: Orders restart works (S7 runs to the end on the naive example)
        # Наивный пример S7 не проходит, но сценарий должен доиграть без
        # ошибки стенда: make перезапускает Orders по просьбе раннера.
        run: |
          make scenarios TASK=2 ONLY=S7 WAIT=3 ORDERS_DIR=./examples/go || true
          jq -e '.scenarios[0].id == "S7" and (.scenarios[0].error // "") == "" and .scenarios[0].pass == false' results/task_2.json
      - name: Stop stand
        if: ${{ always() }}
        run: make down

  grade:
    # Официальная проверка PR идёт в репозитории курса, его workflow.
    # Этот job красный, пока не пройдены все включённые обязательные задания;
    # необязательные (задание 2) на него не влияют. Результат по заданию —
    # check task_N.
    # Push в master репозитория курса — изменения стенда: их проверяет
    # self-test, а grade наивного orders/ был бы заведомо красным.
    if: ${{ !(github.event_name == 'push' && github.repository == 'ippaveln/soa_stand_autumn_2026') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Полная история обоих: правило файлов сравнивает кандидата с репозиторием
      # курса в точке, от которой он отходит (merge-base), — обновления стенда
      # не краснят несинхронизированные форки.
      - uses: actions/checkout@v6
        with:
          repository: ippaveln/soa_stand_autumn_2026
          ref: master
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          # Код форка здесь — только данные: у job токен только на чтение и нет
          # секретов; из кандидата берётся одна директория orders/, она
          # собирается и запускается в контейнере стенда.
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: baseline/go.mod
          cache: false
      - name: Сборка orders/ и сценарии на стенде курса
        # Заглушки, раннер, compose и сценарии — из baseline; из кандидата — только orders/.
        working-directory: baseline
        run: go run ./cmd/grade --baseline . --candidate ../candidate --out ../results
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: soa-results
          path: results
          if-no-files-found: error
      - name: Сводка в аналитику курса
        # Отчитывается каждый прогон, включая форки; github.workflow_repository
        # отличает официальную проверку от прогона в форке. Если grade не дошёл
        # до отчёта, минимальная запись всё равно отмечает попытку.
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ ! -s results/analytics.json ]; then
            mkdir -p results
            jq -n \
              --arg stream "$(jq -r .stream baseline/.etc/config.json 2>/dev/null || true)" \
              --arg repository "$CANDIDATE_REPOSITORY" --arg sha "$CANDIDATE_SHA" \
              --arg actor "$GITHUB_ACTOR" --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
              --arg workflow_repository "$GITHUB_REPOSITORY" --arg event "$GITHUB_EVENT_NAME" \
              '{schema: "github-actions-analytics-v2", stream: $stream, error: "grade did not run",
                github: {repository: $repository, sha: $sha, actor: $actor, run_id: $run_id, run_attempt: $run_attempt,
                         workflow_repository: $workflow_repository, event: $event}}' >results/analytics.json
          fi
          curl --fail-with-body --connect-timeout 3 --max-time 15 -H 'Content-Type: application/json' --data-binary @results/analytics.json "$ANALYTICS_URL"

  task:
    needs: grade
    if: ${{ !cancelled() && needs.grade.result != 'skipped' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Обязательные задания — как в .etc/config.json "tasks" без "optional".
        id: ['1']
    name: task_${{ matrix.id }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ippaveln/soa_stand_autumn_2026
          ref: master
          path: baseline
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: baseline/go.mod
          cache: false
      - uses: actions/download-artifact@v6
        with:
          name: soa-results
          path: results
      - name: Итог задания и правило файлов
        env:
          TASK_ID: ${{ matrix.id }}
        working-directory: baseline
        run: go run ./cmd/checkstatus --results ../results --task "task_${TASK_ID}"

  # Задание 2 необязательное ("optional" в .etc/config.json): его итог —
  # отдельный check «task_2 (необязательное)»: зелёный, если пройдено
  # полностью, иначе серый neutral. Этот job не падает и итог PR не меняет.
  # Право checks: write — только здесь; код студента в этом job не запускается.
  task_2:
    needs: grade
    if: ${{ !cancelled() && needs.grade.result != 'skipped' }}
    runs-on: ubuntu-latest
    name: task_2 · публикация check
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ippaveln/soa_stand_autumn_2026
          ref: master
          path: baseline
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: baseline/go.mod
          cache: false
      - uses: actions/download-artifact@v6
        with:
          name: soa-results
          path: results
      - name: Отчёт по заданию 2 (необязательное)
        working-directory: baseline
        run: go run ./cmd/checkstatus --results ../results --task task_2 --check-run ../check-run.json
      - name: Публикация check «task_2 (необязательное)»
        # Не удалось создать check — отчёт всё равно в summary этого job;
        # красным он из-за этого не становится.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          jq --arg sha "$HEAD_SHA" '. + {head_sha: $sha}' check-run.json | gh api "repos/$REPO/check-runs" --input - --jq .html_url
